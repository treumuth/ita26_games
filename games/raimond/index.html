<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Synchronicity</title>
  <style>
    @font-face { font-family: "Synchronicity Hand"; src: url("assets/fonts/OMORI_GAME2.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
    :root { --bg: #07060d; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <!-- Synchronicity v4. Load order matters: later files use things defined by earlier ones. -->
  <script src="assets/world.js"></script>   <!-- island layout generated from your map (tools/make_world.py) -->
  <script src="js/core.js"></script>        <!-- canvas, input, helpers, music + sound effects -->
  <script src="js/data.js"></script>        <!-- characters, enemies, biomes, items, side quests, lore -->
  <script src="js/sprites.js"></script>     <!-- sprite sheets, portraits, enemy + item art -->
  <script src="js/maps.js"></script>        <!-- big overworld generator + castle/casino interiors -->
  <script src="js/world.js"></script>       <!-- state, stats, spawning, movement, rendering -->
  <script src="js/story.js"></script>       <!-- dialogue (+ rising anger), NPCs, side quests, events, easter eggs -->
  <script src="js/battle.js"></script>      <!-- OMORI-style combat -->
  <script src="js/scenes.js"></script>      <!-- horror scenes, the Shadow, jumpscares -->
  <script src="js/menus.js"></script>       <!-- title, options, saves, X menu, journal, guide, polaroid -->
  <script src="js/main.js"></script>        <!-- game loop + start -->
</body>
</html>
